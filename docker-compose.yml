services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payments
    ports: ['5434:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # AOF persistence: queued jobs survive a Redis restart.
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: ['redisdata:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports: ['1026:1025', '8026:8025']

  # The app itself: docker compose --profile app up --build
  api:
    profiles: [app]
    build: .
    env_file: [{ path: .env, required: false }]
    environment: &app-env
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/payments
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
    command: sh -c 'node dist/db/migrate.js && node dist/db/seed.js && node dist/main.js'
    ports: ['3000:3000']
    depends_on: &app-deps
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }

  worker:
    profiles: [app]
    build: .
    env_file: [{ path: .env, required: false }]
    environment: *app-env
    command: node dist/worker.js
    depends_on:
      <<: *app-deps
      api: { condition: service_started }

volumes:
  pgdata:
  redisdata:
